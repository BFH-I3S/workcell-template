# Module descriptor of a Universal Robots arm, from ur_description (apt).
# What the vendor package does not say and a workcell needs. See CONVENTION.md.
kind: arm

joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint,
         wrist_1_joint, wrist_2_joint, wrist_3_joint]

# Borders, by role. A name starting with _ is the instance's name plus it.
# base_link and tool0 are REP 199's and come with the vendor's macro.
frames: {mount: _mount, base: base_link, flange: tool0}

groups:
  ur_manipulator:
    chain: [base_link, tool0]
    kinematics:
      kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
      kinematics_solver_search_resolution: 0.005
      kinematics_solver_timeout: 0.005
    states:
      up: {shoulder_pan_joint: 0, shoulder_lift_joint: -1.5707, elbow_joint: 0,
           wrist_1_joint: -1.5707, wrist_2_joint: 0, wrist_3_joint: 0}

joint_limits:
  - {package: ur_moveit_config, file: config/joint_limits.yaml}

# ur_robot_driver starts its own controller manager from its own file, so only
# the controller MoveIt executes on is listed.
controllers:
  real:
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      params_files: [{package: ur_robot_driver, file: config/ur_controllers.yaml}]
      moveit: {default: true}
