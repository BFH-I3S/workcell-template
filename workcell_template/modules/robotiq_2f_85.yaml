# Module descriptor of a Robotiq 2F-85, from Robotiq's robotiq_description.
# Used for planning here: no controller, so MoveIt does not move the fingers.
kind: gripper

# The middle of the finger pads, from the flange. Measured on the vendor's meshes.
tcp:
  xyz: [0.0, 0.0, 0.148]
  rpy: [0.0, 0.0, 0.0]

frames: {mount: _mount, tcp: _tcp}

joints: [robotiq_85_left_knuckle_joint]

# Only the driven joint and the mimicking ones, not links: with links the group
# takes in the fixed joint to the flange, and IK for the TCP failed.
groups:
  gripper:
    joints: [robotiq_85_left_knuckle_joint, robotiq_85_right_knuckle_joint,
             robotiq_85_left_inner_knuckle_joint, robotiq_85_right_inner_knuckle_joint,
             robotiq_85_left_finger_tip_joint, robotiq_85_right_finger_tip_joint]
    states:
      open: {robotiq_85_left_knuckle_joint: 0.0}
      closed: {robotiq_85_left_knuckle_joint: 0.7929}

end_effector: gripper
